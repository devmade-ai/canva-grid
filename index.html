<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Requirement: a search result must say what this IS, not only who made
         it. "CanvaGrid" alone is a brand token — it means nothing to someone
         who has never heard of it, which is everyone a search result is for.
         Budget is ~60 characters before Google truncates; this is 52.
         Approach: one authored string per surface, and <title> must equal
         og:title (they are the same claim, and a listing and a shared card
         describing the same page differently is the failure this prevents).
         The tripwire in scripts/__tests__/seo.test.ts enforces both. -->
    <title>CanvaGrid — design social ads in your browser</title>
    <meta name="description" content="Create social media ads for LinkedIn, Facebook, Instagram, Twitter/X and TikTok. Free, in your browser, nothing to install." />
    <!-- Requirement: one winner among the apex, the *.vercel.app alias and every
         per-branch preview alias, which all serve byte-identical HTML and are
         therefore full duplicates of each other competing for the same result. -->
    <link rel="canonical" href="https://canva-grid.vercel.app/" />

    <!-- Requirement: rich link previews ("unfurls") when a CanvaGrid link is
         pasted into Slack, WhatsApp, LinkedIn, X, iMessage, Discord…
         Approach: STATIC tags in index.html. Unfurlers do not run JavaScript,
         so anything injected at runtime is never seen — whatever is in the
         served document is the entire preview, forever, on every platform.
         Absolute URLs throughout: Facebook's crawler rejects a relative
         og:image outright and others resolve it inconsistently.
         The 1200×630 card is generated by scripts/generate-og-image.mjs from
         the same icon.svg as the app icons. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CanvaGrid" />
    <meta property="og:title" content="CanvaGrid — design social ads in your browser" />
    <meta property="og:description" content="Create social media ads for LinkedIn, Facebook, Instagram, Twitter/X and TikTok. Free, in your browser, nothing to install." />
    <meta property="og:url" content="https://canva-grid.vercel.app/" />
    <meta property="og:image" content="https://canva-grid.vercel.app/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The CanvaGrid mark on a light background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CanvaGrid — design social ads in your browser" />
    <meta name="twitter:description" content="Create social media ads for LinkedIn, Facebook, Instagram, Twitter/X and TikTok. Free, in your browser, nothing to install." />
    <meta name="twitter:image" content="https://canva-grid.vercel.app/og-card.png" />

    <!-- Requirement: let a search engine resolve WHAT this is rather than infer
         it from prose. WebApplication is the accurate node type — it is a tool
         that runs in the browser, not an article and not a downloadable app.
         Approach: ONE @graph with @id-joined nodes, so the app, its publisher
         and the site are stated once and referenced rather than repeated.
         Note: type="application/ld+json" is a DATA block, not an executable
         script — CSP script-src does not govern it, so it works under a strict
         policy with no 'unsafe-inline'. Say so, or the next inline-script audit
         deletes it. -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://canva-grid.vercel.app/#org","name":"devmade-ai","url":"https://canva-grid.vercel.app/"},{"@type":"WebSite","@id":"https://canva-grid.vercel.app/#website","url":"https://canva-grid.vercel.app/","name":"CanvaGrid","publisher":{"@id":"https://canva-grid.vercel.app/#org"}},{"@type":"WebApplication","@id":"https://canva-grid.vercel.app/#app","name":"CanvaGrid","url":"https://canva-grid.vercel.app/","description":"Create social media ads for LinkedIn, Facebook, Instagram, Twitter/X and TikTok. Free, in your browser, nothing to install.","applicationCategory":"DesignApplication","operatingSystem":"Any","browserRequirements":"Requires JavaScript","isPartOf":{"@id":"https://canva-grid.vercel.app/#website"},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}]}
    </script>

    <!-- PWA -->
    <!-- Single meta theme-color tag — first-visit default is light (fantasy),
         so the pre-JS fallback is also light regardless of OS prefers-color-scheme.
         The inline flash-prevention script below overrides this when the user
         has stored darkMode='true'. Once React mounts, useDarkMode keeps the
         tag in sync with the active theme via querySelectorAll.
         Auto-rewritten by scripts/generate-theme-meta.mjs from default combo. -->
    <meta name="theme-color" content="#6d0076" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CanvaGrid" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />

    <!-- Dark mode + theme flash prevention — apply .dark class + data-theme before first paint.
         The useDarkMode hook runs after React mounts, too late to prevent a flash.
         This inline classic (non-module) script reads localStorage and applies both
         .dark (Tailwind) and data-theme (DaisyUI) during HTML parse.
         Keys: 'darkMode', 'themeCombo'. Combos: mono (lofi/black), luxe (fantasy/luxury).
         First-visit default is light (no stored value → false). Brand-aligned with PWA icon. -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('darkMode');
          var isDark = stored === 'true';
          var root = document.documentElement;
          if (isDark) root.classList.add('dark');
          // Combo-based theme resolution (with migration from old lightTheme/darkTheme keys)
          var combos = {"mono":{"light":"lofi","dark":"black"},"luxe":{"light":"fantasy","dark":"luxury"}};
          var comboId = localStorage.getItem('themeCombo') || 'luxe';
          var combo = combos[comboId] || combos.mono;
          var theme = isDark ? combo.dark : combo.light;
          root.setAttribute('data-theme', theme);
          var metaColors = {"lofi":"#ebebeb","black":"#000000","fantasy":"#6d0076","luxury":"#09090b"};
          var mc = metaColors[theme] || '#808080';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function(m) { m.setAttribute('content', mc); });
        } catch(e) {}
      })();
    </script>

    <!-- Capture PWA install prompt before framework mounts.
         Requirement: beforeinstallprompt can fire before React hydrates on cached SW repeat visits.
         Approach: Inline non-module script stores the event on window for the React hook to pick up.
         Alternatives:
           - Listen only in React hook: Rejected - event lost if fired before mount. -->
    <script>
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });
    </script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1K77DCFXNM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1K77DCFXNM');
      window._pageLoadTime = Date.now();
    </script>

    <!-- Fonts. crossorigin="anonymous" makes the stylesheet's cssRules
         JS-readable — see CLAUDE.md "Font embedding for export". -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <div id="debug-root"></div>

    <!-- Pre-React debug pill — captures errors before JS bundles load.
         Requirement: React pill can't catch bundle load failures or pre-mount crashes.
         Approach: Inline script with circular buffer, global error capture, 20s loading timeout.
         Bridges to React app via window.__debugPushError() global. -->
    <script>
      window.__debugErrors = [];
      window.__debugPushError = function(msg, stack) {
        window.__debugErrors.push({ msg: msg, stack: stack, time: Date.now() });
        if (window.__debugErrors.length > 200) window.__debugErrors.shift();
      };
      // Named handlers so debugLog.js can removeEventListener after takeover
      window.__debugPreErrorHandler = function(e) {
        var stack = (e.error && e.error.stack) || ((e.filename || '') + ':' + (e.lineno || 0));
        window.__debugPushError(e.message || 'Unknown error', stack);
      };
      window.__debugPreRejectionHandler = function(e) {
        window.__debugPushError('Unhandled rejection: ' + e.reason);
      };
      window.addEventListener('error', window.__debugPreErrorHandler);
      window.addEventListener('unhandledrejection', window.__debugPreRejectionHandler);
      window.__debugReactMounted = false;
      window.__debugClearLoadTimer = function() {
        window.__debugReactMounted = true;
        clearTimeout(window.__debugLoadTimer);
      };
      window.__debugLoadTimer = setTimeout(function() {
        if (!window.__debugReactMounted) {
          var root = document.getElementById('root');
          if (root) {
            var warning = document.createElement('p');
            warning.style.cssText = 'color:#eab308;font-size:14px;margin-top:12px;text-align:center;font-family:system-ui,sans-serif';
            warning.textContent = 'This is taking longer than usual. Check the debug pill for errors, or try reloading.';
            root.appendChild(warning);
          }
        }
      }, 20000);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
